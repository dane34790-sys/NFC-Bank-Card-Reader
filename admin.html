<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #12122a, #1a1a3e);
            border-radius: 28px;
            padding: 25px 20px 30px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,215,0,0.05);
        }
        .app-header { text-align:center; margin-bottom:20px; }
        .app-title {
            font-size:24px; font-weight:800;
            background:linear-gradient(135deg,#ffd700,#ffaa00);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:0.5px;
        }
        .app-subtitle { color:rgba(255,255,255,0.4); font-size:12px; letter-spacing:2px; margin-top:2px; }
        .cloud-badge { background:#2196f3; color:#fff; padding:3px 12px; border-radius:12px; font-size:10px; display:inline-block; margin-left:8px; -webkit-text-fill-color:#fff; }
        
        .form-group { margin-bottom:12px; }
        .form-label { display:block; color:#ffd700; font-size:11px; margin-bottom:4px; font-weight:bold; letter-spacing:0.5px; }
        .form-input { width:100%; padding:10px 14px; background:rgba(0,0,0,0.6); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:10px; font-size:14px; box-sizing:border-box; transition:all 0.3s; }
        .form-input:focus { outline:none; border-color:#ffd700; background:rgba(0,0,0,0.8); }
        .form-select { width:100%; padding:10px 14px; background:rgba(0,0,0,0.6); color:#fff; border:1px solid rgba(255,255,255,0.15); border-radius:10px; font-size:14px; box-sizing:border-box; cursor:pointer; }
        .form-select:focus { outline:none; border-color:#ffd700; }
        
        .btn { width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; margin-top:6px; transition:all 0.2s; }
        .btn:active { transform:scale(0.96); }
        .btn-green { background:#4caf50; color:#fff; }
        .btn-blue { background:#2196f3; color:#fff; }
        .btn-red { background:#f44336; color:#fff; }
        .btn-orange { background:#ff9800; color:#fff; }
        .btn-purple { background:#9c27b0; color:#fff; }
        .btn-gold { background:#ffd700; color:#000; }
        .btn-cyan { background:#00bcd4; color:#fff; }
        
        .status-bar { background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:10px; text-align:center; font-size:12px; margin-top:12px; color:#aaa; }
        .section-title { color:#ffd700; font-size:12px; font-weight:700; margin:18px 0 10px; padding-bottom:5px; border-bottom:1px solid rgba(255,215,0,0.2); letter-spacing:1px; }
        .highlight { background:rgba(255,152,0,0.15); border:1px solid #ff9800; border-radius:8px; padding:8px; margin:8px 0; color:#ff9800; font-size:12px; text-align:center; }
        .highlight.hidden { display:none; }
        .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
        .btn-row .btn { flex:1; min-width:100px; margin-top:0; }
        
        .two-col { display:flex; gap:10px; }
        .two-col .form-group { flex:1; }
        
        .refresh-btn {
            position:fixed; bottom:20px; right:20px; z-index:9999;
            background:rgba(255,215,0,0.15);
            border:1px solid rgba(255,215,0,0.3);
            border-radius:50%;
            width:45px; height:45px;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; cursor:pointer;
            backdrop-filter:blur(10px);
            box-shadow:0 4px 20px rgba(0,0,0,0.5);
            transition:all 0.3s;
            color:#ffd700;
        }
        .refresh-btn:hover { transform:scale(1.1); background:rgba(255,215,0,0.25); }
        .refresh-btn:active { transform:scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1 class="app-title">🔧 Admin Panel <span class="cloud-badge">☁️ Firebase</span></h1>
            <p class="app-subtitle">REMOTE CARD CONTROL</p>
        </div>

        <div class="glass-card">
            
            <!-- ===== کنترل از راه دور ===== -->
            <div class="section-title">🎮 Remote Control</div>
            
            <div class="form-group">
                <label class="form-label">🆔 Employee ID to Control</label>
                <input type="text" class="form-input" id="controlEmpId" maxlength="13" placeholder="Enter Employee ID" style="text-align:center; font-size:18px; letter-spacing:3px;">
            </div>
            
            <div class="btn-row">
                <button class="btn btn-blue" onclick="loadEmployeeData()">📥 Load</button>
                <button class="btn btn-orange" onclick="toggleOnlineOffline()">🔄 Toggle</button>
                <button class="btn btn-red" onclick="resetRemainder()">💰 Reset</button>
                <button class="btn btn-purple" onclick="addBalance()">➕ Add €1k</button>
            </div>
            
            <div id="employeeStatus" class="highlight hidden">
                <span id="empStatusText">No employee loaded</span>
            </div>
            
            <!-- ===== اطلاعات کارت ===== -->
            <div class="section-title">💳 Card Setup</div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">🌐 Card Status</label>
                    <select class="form-select" id="cardStatus">
                        <option value="Online">🟢 Online</option>
                        <option value="Offline">🔴 Offline</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">🏛️ Bank Name</label>
                    <input type="text" class="form-input" id="nameBank" value="Commerzbank">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">👤 Account Name</label>
                <input type="text" class="form-input" id="accountName" value="Mazdak Monshizadeh">
            </div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">💳 Card Number</label>
                    <input type="text" class="form-input" id="cardNumber" maxlength="16" value="5232242096782922">
                </div>
                <div class="form-group">
                    <label class="form-label">🆔 Employee ID</label>
                    <input type="text" class="form-input" id="empId" maxlength="13" value="1783340149960">
                </div>
            </div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">💰 Account Balance (ثابت)</label>
                    <input type="text" class="form-input" id="accountBalance" value="8,538,616" style="border-color:#4caf50;">
                </div>
                <div class="form-group">
                    <label class="form-label">💰 Remainder (کسر از این)</label>
                    <input type="text" class="form-input" id="remainderBalance" value="8,538,606" style="border-color:#ff9800;">
                </div>
            </div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">🔑 Security Key</label>
                    <input type="text" class="form-input" id="securityKey" value="Delta789032Delta">
                </div>
                <div class="form-group">
                    <label class="form-label">📍 Zip Code</label>
                    <input type="text" class="form-input" id="zipCode" value="De65590">
                </div>
            </div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">🔒 Cvv2</label>
                    <input type="text" class="form-input" id="cvv2" maxlength="4" value="522">
                </div>
                <div class="form-group">
                    <label class="form-label">📋 Line Card</label>
                    <input type="text" class="form-input" id="lineCard" value="Hannover5690">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">📞 Phone Number</label>
                <input type="text" class="form-input" id="phone" value="+989920872851">
            </div>
            
            <div class="two-col">
                <div class="form-group">
                    <label class="form-label">🔐 PIN (4 digits)</label>
                    <input type="text" class="form-input" id="pin" maxlength="4" value="1234" style="letter-spacing:10px; font-size:20px;">
                </div>
                <div class="form-group" style="display:flex; align-items:flex-end; gap:8px;">
                    <button class="btn btn-cyan" onclick="deductOneEuroFromAdmin()" style="padding:10px; margin-top:0;">💰 -1€</button>
                </div>
            </div>

            <!-- ===== دکمه‌ها ===== -->
            <div class="btn-row">
                <button class="btn btn-green" onclick="saveAndWrite()">💾 Save & Write</button>
                <button class="btn btn-orange" onclick="writeWithAlternative()">🔄 جایگزین</button>
            </div>
            
            <button class="btn btn-blue" onclick="saveToCloud()">☁️ Save to Firebase</button>

            <div class="status-bar" id="adminStatus">⏳ Ready - Firebase Connected ☁️</div>
        </div>
    </div>

    <!-- ===== دکمه رفرش ===== -->
    <div class="refresh-btn" onclick="location.reload()" title="Refresh">🔄</div>

    <script>
        // ============================================================
        // ===== FIREBASE =====
        // ============================================================
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAYsu4Ji-eFHx55ARX6_4PRb5SRfx-jrhw",
            authDomain: "employee-app-b7215.firebaseapp.com",
            databaseURL: "https://employee-app-b7215-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "employee-app-b7215",
            storageBucket: "employee-app-b7215.appspot.com",
            messagingSenderId: "961058467244",
            appId: "1:961058467244:web:6b4af6cbb8270ef94e1e09"
        };

        firebase.initializeApp(FIREBASE_CONFIG);
        const database = firebase.database();
        console.log('🔥 Firebase Connected');

        // ============================================================
        // ===== FUNCTIONS =====
        // ============================================================

        async function getCardData(id) {
            try {
                const snapshot = await database.ref('employees/' + id).once('value');
                return snapshot.val();
            } catch (e) {
                console.warn('Firebase error:', e);
                return null;
            }
        }

        // ============================================================
        // ===== کسر ۱ یورو از Remainder (برای ادمین) =====
        // ============================================================

        async function deductOneEuroFromAdmin() {
            const empId = document.getElementById('controlEmpId').value.trim();
            if (!empId) {
                updateStatus('❌ Enter Employee ID first', '#f44336');
                return;
            }

            try {
                const data = await getCardData(empId);
                if (!data) {
                    updateStatus('❌ Employee not found', '#f44336');
                    return;
                }

                // دریافت Remainder
                let remainder = parseFloat(String(data.remainderBalance || data.salary || 0).replace(/[^0-9.]/g, '')) || 0;
                let newRemainder = Math.max(0, remainder - 1);
                let newRemainderStr = newRemainder.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});

                // آپدیت Firebase
                await database.ref('employees/' + empId).update({
                    remainderBalance: newRemainderStr,
                    lastFeeDate: Date.now()
                });

                // آپدیت فرم
                document.getElementById('remainderBalance').value = newRemainderStr;
                updateStatus(`✅ €1 deducted from Remainder: ${newRemainderStr}`, '#4caf50');
                console.log(`💰 New Remainder: ${newRemainderStr}`);

            } catch (err) {
                console.error('Error:', err);
                updateStatus('❌ Error: ' + err.message, '#f44336');
            }
        }

        // ============================================================
        // ===== سایر توابع =====
        // ============================================================

        function updateStatus(text, color = '#aaa') {
            const el = document.getElementById('adminStatus');
            if (el) {
                el.textContent = text;
                el.style.color = color;
            }
        }

        function hashPin(pin) {
            let hash = 0;
            for (let i = 0; i < pin.length; i++) {
                hash = ((hash << 5) - hash) + pin.charCodeAt(i) * (i + 3);
                hash = hash & hash;
            }
            return Math.abs(hash).toString(36);
        }

        function getFormData() {
            return {
                cardStatus: document.getElementById('cardStatus').value,
                nameBank: document.getElementById('nameBank').value.trim(),
                accountName: document.getElementById('accountName').value.trim(),
                cardNumber: document.getElementById('cardNumber').value.trim(),
                accountBalance: document.getElementById('accountBalance').value.trim(),
                remainderBalance: document.getElementById('remainderBalance').value.trim(),
                securityKey: document.getElementById('securityKey').value.trim(),
                zipCode: document.getElementById('zipCode').value.trim(),
                cvv2: document.getElementById('cvv2').value.trim(),
                lineCard: document.getElementById('lineCard').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                empId: document.getElementById('empId').value.trim(),
                pin: document.getElementById('pin').value.trim()
            };
        }

        async function loadEmployeeData() {
            const empId = document.getElementById('controlEmpId').value.trim();
            if (!empId) { updateStatus('❌ Enter Employee ID', '#f44336'); return; }
            updateStatus('📥 Loading...', '#2196f3');
            const data = await getCardData(empId);
            if (data) {
                document.getElementById('cardStatus').value = (data.status === 'ONLINE' || data.cardStatus === 'Online') ? 'Online' : 'Offline';
                document.getElementById('nameBank').value = data.nameBank || '';
                document.getElementById('accountName').value = data.accountName || '';
                document.getElementById('cardNumber').value = data.cardNumber || '';
                document.getElementById('accountBalance').value = data.accountBalance || '';
                document.getElementById('remainderBalance').value = data.remainderBalance || data.salary || '';
                document.getElementById('securityKey').value = data.securityKey || '';
                document.getElementById('zipCode').value = data.zipCode || data.zip || '';
                document.getElementById('cvv2').value = data.cvv2 || '';
                document.getElementById('lineCard').value = data.lineCard || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('empId').value = data.empId || empId;
                document.getElementById('employeeStatus').classList.remove('hidden');
                document.getElementById('empStatusText').textContent = '✅ ' + (data.accountName || 'Employee') + ' | Remainder: ' + (data.remainderBalance || 'N/A');
                updateStatus('✅ Loaded', '#4caf50');
            } else {
                updateStatus('❌ Not found', '#f44336');
            }
        }

        async function toggleOnlineOffline() {
            const empId = document.getElementById('controlEmpId').value.trim();
            if (!empId) { updateStatus('❌ Enter ID', '#f44336'); return; }
            const data = await getCardData(empId);
            if (data) {
                const newStatus = (data.status === 'ONLINE' || data.cardStatus === 'Online') ? 'OFFLINE' : 'ONLINE';
                await database.ref('employees/' + empId).update({ status: newStatus, cardStatus: newStatus === 'ONLINE' ? 'Online' : 'Offline' });
                document.getElementById('cardStatus').value = newStatus === 'ONLINE' ? 'Online' : 'Offline';
                updateStatus('✅ Status: ' + newStatus, '#4caf50');
            }
        }

        async function resetRemainder() {
            const empId = document.getElementById('controlEmpId').value.trim();
            if (!empId || !confirm('Reset remainder to zero?')) return;
            await database.ref('employees/' + empId).update({ remainderBalance: '0' });
            document.getElementById('remainderBalance').value = '0';
            updateStatus('✅ Reset to 0', '#4caf50');
        }

        async function addBalance() {
            const empId = document.getElementById('controlEmpId').value.trim();
            if (!empId) { updateStatus('❌ Enter ID', '#f44336'); return; }
            const data = await getCardData(empId);
            if (data) {
                let current = parseFloat(String(data.remainderBalance || data.salary || 0).replace(/[^0-9.]/g, '')) || 0;
                let newVal = current + 1000;
                let newStr = newVal.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
                await database.ref('employees/' + empId).update({ remainderBalance: newStr });
                document.getElementById('remainderBalance').value = newStr;
                updateStatus('✅ +€1,000: ' + newStr, '#4caf50');
            }
        }

        async function saveToCloud() {
            const data = getFormData();
            if (!data.empId || !data.pin) { updateStatus('❌ Fill required fields', '#f44336'); return; }
            const cardData = { ...data, pinHash: hashPin(data.pin), status: data.cardStatus === 'Online' ? 'ONLINE' : 'OFFLINE' };
            await database.ref('employees/' + data.empId).update(cardData);
            updateStatus('✅ Saved to Firebase', '#4caf50');
        }

        // ============================================================
        // ===== WRITE NFC =====
        // ============================================================

        async function saveAndWrite() {
            const data = getFormData();
            if (!data.empId || !data.pin || data.pin.length !== 4) {
                updateStatus('❌ ID and 4-digit PIN required', '#f44336');
                return;
            }
            
            const cardData = { ...data, pinHash: hashPin(data.pin), status: data.cardStatus === 'Online' ? 'ONLINE' : 'OFFLINE' };
            await database.ref('employees/' + data.empId).update(cardData);
            
            updateStatus('📱 Tap card to write...', '#ffd700');
            
            try {
                if (!('NDEFReader' in window)) throw new Error('NFC not supported');
                
                const writer = new NDEFReader();
                await writer.write({
                    records: [
                        { recordType: 'text', data: 'Mastercard_Commerzbank' },
                        { recordType: 'text', data: '?' + data.empId + '=' + data.cardNumber + ';' },
                        { recordType: 'text', data: 'MSG:Use official app with PIN' }
                    ]
                });
                
                updateStatus('✅ Write successful!', '#4caf50');
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                
            } catch (err) {
                console.error('NFC Error:', err);
                updateStatus('❌ Error: ' + err.message, '#f44336');
            }
        }

        async function writeWithAlternative() {
            const data = getFormData();
            if (!data.empId || !data.pin || data.pin.length !== 4) {
                updateStatus('❌ ID and 4-digit PIN required', '#f44336');
                return;
            }
            
            updateStatus('🔄 Alternative method...', '#ffd700');
            
            try {
                const reader = new NDEFReader();
                await reader.scan();
                
                let done = false;
                reader.onreading = async (e) => {
                    if (done) return;
                    done = true;
                    try {
                        const writer = new NDEFReader();
                        await writer.write({
                            records: [
                                { recordType: 'text', data: 'Mastercard_Commerzbank' },
                                { recordType: 'text', data: '?' + data.empId + '=' + data.cardNumber + ';' },
                                { recordType: 'text', data: 'MSG:Use official app with PIN' }
                            ]
                        });
                        updateStatus('✅ Write successful!', '#4caf50');
                    } catch (err) {
                        downloadNFCFile(data);
                    }
                };
                
                setTimeout(() => {
                    if (!done) downloadNFCFile(data);
                }, 20000);
                
            } catch (err) {
                downloadNFCFile(data);
            }
        }

        function downloadNFCFile(data) {
            const content = `Mastercard_Commerzbank\n?${data.empId}=${data.cardNumber};\nMSG:Use official app with PIN`;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `nfc_${data.empId}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            updateStatus('📄 File downloaded', '#2196f3');
            
            alert(`✅ File downloaded!\n\nCopy these 3 lines to NFC Tools:\n1. Mastercard_Commerzbank\n2. ?${data.empId}=${data.cardNumber};\n3. MSG:Use official app with PIN`);
        }

        console.log('✅ Admin Panel Ready');
        console.log('💰 دکمه -1€ برای کسر از Remainder');
    </script>
</body>
    </html>
