<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💳 Visa & Mastercard NFC</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: url('bg-main.png') center/cover no-repeat fixed;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position:relative;
        }
        body::before {
            content:'';
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.55);
            z-index:0;
        }
        .container {
            max-width: 480px;
            width: 95%;
            background: url('frame.png') center/cover no-repeat;
            border-radius: 32px;
            padding: 30px 24px 35px;
            border: 1.5px solid rgba(255, 215, 0, 0.2);
            box-shadow: 
                0 30px 80px rgba(0,0,0,0.9), 
                0 0 60px rgba(255,215,0,0.08),
                0 0 120px rgba(0,180,255,0.04);
            position:relative;
            z-index:1;
        }
        .container::before {
            content:'';
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.4);
            border-radius:32px;
            z-index:0;
        }
        .container > * { position:relative; z-index:1; }
        .app-header { text-align:center; margin-bottom:25px; }
        .app-title {
            font-size:30px; font-weight:900;
            background:linear-gradient(135deg,#ffd700,#ffaa00,#ffd700);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:1px;
        }
        .app-subtitle { color:rgba(255,255,255,0.5); font-size:14px; letter-spacing:3px; margin-top:4px; }
        
        .nfc-area {
            text-align:center; padding:30px 20px;
            border:2px dashed rgba(255,215,0,0.25);
            border-radius:24px; cursor:pointer;
            background: url('nfc-bg.png') center/cover no-repeat;
            transition:all 0.3s;
            min-height:220px;
            display:flex; flex-direction:column; 
            align-items:center; justify-content:center;
            position:relative; overflow:hidden;
        }
        .nfc-area::before {
            content:'';
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.45); border-radius:24px; z-index:0;
        }
        .nfc-area:active { border-color:#ffd700; transform:scale(0.98); }
        .nfc-icon { font-size:70px; margin-bottom:12px; animation:pulse 2s ease-in-out infinite; position:relative; z-index:1; }
        @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
        .nfc-text { color:#ffd700; font-size:20px; font-weight:700; letter-spacing:1px; position:relative; z-index:1; }
        .nfc-hint { color:rgba(255,255,255,0.6); font-size:12px; margin-top:8px; letter-spacing:2px; position:relative; z-index:1; }
        
        .status-bar { margin-top:15px; padding:14px; background:rgba(0,0,0,0.5); border-radius:14px; text-align:center; border:1px solid rgba(255,255,255,0.08); }
        #statusText { font-size:15px; font-weight:600; color:#aaa; letter-spacing:1px; }

        /* ===== صفحه PIN ===== */
        .pin-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            z-index:99999;
            justify-content:center; align-items:center; flex-direction:column;
            background: url('pin-bg.png') center/cover no-repeat;
        }
        .pin-overlay::before {
            content:'';
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.6);
            z-index:0;
        }
        .pin-overlay.active { display:flex !important; }
        .pin-dialog {
            background:linear-gradient(145deg,rgba(26,26,62,0.95),rgba(15,15,42,0.95));
            border:2px solid #ffd700; border-radius:24px;
            padding:30px 25px; max-width:320px; width:90%; text-align:center;
            position:relative; z-index:1;
            backdrop-filter:blur(10px);
        }
        .pin-title { color:#ffd700; font-size:22px; font-weight:700; margin-bottom:4px; }
        .pin-sub { color:rgba(255,255,255,0.4); font-size:12px; margin-bottom:12px; }
        .pin-dots { font-size:34px; letter-spacing:12px; color:#ffd700; margin:12px 0; font-weight:bold; font-family:monospace; }
        .pin-keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
        .pin-key {
            padding:14px; font-size:20px; border:none; border-radius:12px;
            background:rgba(255,255,255,0.06); color:#fff; cursor:pointer; font-weight:600;
        }
        .pin-key:active { background:#ffd700; color:#000; }
        .pin-key.clear { color:#f44336; }
        .pin-key.enter { color:#4caf50; }
        .pin-cancel {
            background:rgba(255,255,255,0.05); color:#888;
            border:1px solid rgba(244,67,54,0.3); border-radius:10px;
            padding:8px 25px; margin-top:8px; cursor:pointer; font-size:13px; width:100%;
        }

        /* ===== کارت بانکی ===== */
        .bank-card {
            margin-top:15px;
            background: url('card nfc-bg.png') center/100% 100% no-repeat;
            border-radius:16px; position:relative;
            display:none; width:100%;
            aspect-ratio:1.58/1;
            box-shadow:0 20px 50px rgba(0,0,0,0.7);
        }
        .bank-card.show { display:block; animation:fadeSlideUp 0.5s ease; }
        @keyframes fadeSlideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

        .bank-name {
            position:absolute; top:7%; left:5%; z-index:2;
            font-size:16px; font-weight:900; letter-spacing:2px;
            color:#000; font-family:'Courier New', monospace;
        }
        .vip-gold {
            position:absolute; top:7%; right:5%; z-index:2;
            font-size:14px; font-weight:900; letter-spacing:2px;
            color:#000; font-family:'Courier New', monospace;
        }
        .mastercard-logo-card {
            position:absolute; bottom:8%; right:5%; z-index:2;
            display:flex; align-items:center;
        }
        .mc-red { width:30px; height:30px; background:#eb001b; border-radius:50%; opacity:1; margin-right:-7px; }
        .mc-yellow { width:30px; height:30px; background:#f79e1b; border-radius:50%; opacity:1; }

        .card-number {
            position:absolute; top:58%; left:50%; transform:translate(-50%,-50%); z-index:2;
            font-size:19px; font-weight:900; letter-spacing:3px;
            color:#000; text-align:center;
            font-family:'Courier New', monospace; white-space:nowrap;
        }
        .card-holder {
            position:absolute; bottom:8%; left:5%; z-index:2;
            font-size:15px; font-weight:900; letter-spacing:2px;
            color:#000; text-transform:uppercase;
            font-family:'Courier New', monospace;
        }
        .balance-display {
            position:absolute; bottom:8%; left:50%; transform:translateX(-50%); z-index:2;
            font-size:20px; font-weight:900; color:#000;
            font-family:'Courier New', monospace;
        }
        .fee-notice { 
            background:rgba(255,152,0,0.3); border:1px solid #ff9800; 
            border-radius:6px; padding:5px; text-align:center; margin-top:8px; 
            color:#fff; font-size:10px; font-weight:600; display:none;
        }
        .fee-notice.show { display:block; }

        /* ===== کادر اطلاعات ===== */
        #fullInfo { 
            margin-top:12px; padding:15px 14px; 
            background:linear-gradient(160deg, rgba(8,8,25,0.85), rgba(15,15,40,0.9));
            backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
            border-radius:18px; border:1px solid rgba(255,215,0,0.2);
            display:none;
            box-shadow:0 20px 50px rgba(0,0,0,0.7);
            position:relative; overflow:hidden;
        }
        #fullInfo.show { display:block; animation:fadeSlideUp 0.4s ease; }
        #fullInfo::before {
            content:''; position:absolute; top:-50%; right:-25%;
            width:180px; height:180px;
            background:radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
            border-radius:50%;
        }
        #fullInfo::after {
            content:''; position:absolute; bottom:-40%; left:-20%;
            width:160px; height:160px;
            background:radial-gradient(circle, rgba(100,0,255,0.04) 0%, transparent 70%);
            border-radius:50%;
        }
        #fullInfo h3 { color:#ffd700; margin-bottom:10px; text-align:center; font-size:14px; letter-spacing:2px; position:relative; z-index:1; }
        #infoContent { font-family:'Courier New',monospace; font-size:10px; line-height:1.9; color:#ffd700; position:relative; z-index:1; }
        #infoContent div { padding:2px 6px; border-bottom:1px solid rgba(255,215,0,0.04); display:flex; justify-content:space-between; align-items:center; border-radius:5px; }
        #infoContent span { font-weight:bold; text-align:right; color:#00e676; text-shadow:0 0 8px rgba(0,230,118,0.1); }
        
        .notification-toast {
            position:fixed; bottom:25px; left:50%; transform:translateX(-50%);
            background:linear-gradient(145deg,#1a1a3e,#0d0d24);
            border:1px solid rgba(255,215,0,0.2); border-radius:14px;
            padding:14px 24px; min-width:180px; text-align:center; z-index:9999;
            display:none;
        }
        .notification-toast.show { display:block; }
        .notif-balance { font-size:24px; font-weight:800; color:#4caf50; margin:3px 0; }
        .notification-toast p { color:rgba(255,255,255,0.5); font-size:10px; }
        
        @media (max-width:400px) {
            .container { padding:15px 10px; }
            .pin-dialog { padding:25px 18px; }
            .pin-key { padding:12px; font-size:18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <h1 class="app-title">💳 NFC Reader</h1>
        <p class="app-subtitle">Visa & Mastercard NFC</p>
    </div>

    <div class="nfc-area" onclick="startReading()">
        <div class="nfc-icon">📱💳</div>
        <p class="nfc-text">Tap Card on Phone</p>
        <p class="nfc-hint">HOLD YOUR CARD NEAR THE NFC ANTENNA</p>
    </div>

    <div class="status-bar">
        <span id="statusText">🔒 Ready to Scan</span>
    </div>

    <div id="bankCard" class="bank-card">
        <div class="bank-name">COMMERZBANK</div>
        <div class="vip-gold">VIP GOLD</div>
        <div class="mastercard-logo-card">
            <div class="mc-red"></div>
            <div class="mc-yellow"></div>
        </div>
        <div class="card-number" id="cardNumberDisplay">•••• •••• •••• 0000</div>
        <div class="card-holder" id="cardHolder">---</div>
        <div class="balance-display" id="balanceDisplay">€0</div>
        <div id="feeNotice" class="fee-notice">💰 €1.00 fee deducted</div>
    </div>

    <div id="fullInfo">
        <h3>📋 Card Information</h3>
        <div id="infoContent"></div>
    </div>

    <div id="notification" class="notification-toast">
        <p>🏦 COMMERZBANK</p>
        <div class="notif-balance" id="notifBalance">€0</div>
        <p>Remainder Balance</p>
    </div>
</div>

<div id="pinOverlay" class="pin-overlay">
    <div class="pin-dialog">
        <h3 class="pin-title">🔐 Enter PIN</h3>
        <p class="pin-sub">Enter your 4-digit PIN</p>
        <div class="pin-dots" id="pinDots">○○○○</div>
        <div class="pin-keypad" id="pinKeypad"></div>
        <button class="pin-cancel" onclick="closePin()">❌ Cancel</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAYsu4Ji-eFHx55ARX6_4PRb5SRfx-jrhw",
    authDomain: "employee-app-b7215.firebaseapp.com",
    databaseURL: "https://employee-app-b7215-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "employee-app-b7215",
    storageBucket: "employee-app-b7215.appspot.com",
    messagingSenderId: "961058467244",
    appId: "1:961058467244:web:6b4af6cbb8270ef94e1e09"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

let currentEmpId = null;
let enteredPin = '';
let isProcessing = false;

function updateStatus(text, color = '#fff') {
    const el = document.getElementById('statusText');
    if (el) { el.textContent = text; el.style.color = color; }
}

function hideAll() {
    document.getElementById('bankCard')?.classList.remove('show');
    document.getElementById('fullInfo')?.classList.remove('show');
    document.getElementById('feeNotice')?.classList.remove('show');
}

function showPinDialog() {
    document.getElementById('pinOverlay').classList.add('active');
    enteredPin = '';
    document.getElementById('pinKeypad').innerHTML = [1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k => {
        let cls = 'pin-key';
        if (k === '⌫') cls += ' clear';
        if (k === '✓') cls += ' enter';
        return `<button class="${cls}" onclick="pressPinKey('${k}')">${k}</button>`;
    }).join('');
    updatePinDots();
    updateStatus('🔐 Enter PIN', '#ffd700');
}

function closePin() { document.getElementById('pinOverlay').classList.remove('active'); }
function pressPinKey(key) {
    if (key === '⌫') enteredPin = enteredPin.slice(0, -1);
    else if (key === '✓') { if (enteredPin.length === 4) verifyPin(); return; }
    else if (enteredPin.length < 4) enteredPin += key;
    updatePinDots();
}
function updatePinDots() {
    document.getElementById('pinDots').textContent = '●'.repeat(enteredPin.length) + '○'.repeat(4 - enteredPin.length);
}

async function verifyPin() {
    if (isProcessing) return;
    isProcessing = true;
    if (!currentEmpId) { isProcessing = false; return; }
    
    try {
        const snap = await database.ref('employees/' + currentEmpId).once('value');
        const data = snap.val();
        if (!data) { updateStatus('❌ Not found', '#f44336'); isProcessing = false; return; }
        
        closePin();
        updateStatus('💰 Processing...', '#ff9800');
        
        let curBal = parseInt(String(data.salary || '0').replace(/[€,]/g, '')) || 0;
        let curRem = parseInt(String(data.remainderBalance || '0').replace(/[€,]/g, '')) || 0;
        let newBal = Math.max(0, curBal - 1);
        let newRem = Math.max(0, curRem - 1);
        
        const now = new Date();
        await database.ref('employees/' + currentEmpId).update({
            salary: '€' + newBal.toLocaleString('en-US'),
            accountBalance: newBal,
            remainderBalance: String(newRem),
            transactions: [{
                after: newRem, amount: -1, before: curRem,
                date: now.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' }),
                receipt: 'TRX-' + String(Math.floor(Math.random() * 90000000) + 10000000),
                time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
                type: "Daily Charge"
            }],
            lastFeeDate: Date.now()
        });
        
        document.getElementById('cardNumberDisplay').textContent = '•••• •••• •••• ' + String(data.cardNumber || '0000').slice(-4);
        document.getElementById('cardHolder').textContent = (data.accountName || 'Employee').toUpperCase();
        document.getElementById('balanceDisplay').textContent = '€' + newRem.toLocaleString('en-US');
        document.getElementById('bankCard').classList.add('show');
        
        document.getElementById('infoContent').innerHTML = `
            <div>🌐 Status <span>${data.cardStatus || data.status || 'Online'}</span></div>
            <div>🏛️ Name Bank <span>${data.nameBank || 'COMMERZBANK'}</span></div>
            <div>👤 Account Name <span>${data.accountName || '-'}</span></div>
            <div>💳 Card Number <span>${data.cardNumber || '-'}</span></div>
            <div>💰 Account Balance <span>${data.accountBalance || '€' + newBal.toLocaleString('en-US')}</span></div>
            <div>💰 Remainder Balance <span>${newRem.toLocaleString('en-US')}</span></div>
            <div>🔑 Security Key <span>${data.securityKey || '-'}</span></div>
            <div>📍 Zip Code <span>${data.zipCode || '-'}</span></div>
            <div>🔒 Cvv2 <span>${data.cvv2 || '-'}</span></div>
            <div>📋 Line Card <span>${data.lineCard || '-'}</span></div>
            <div>📞 Phone <span>${data.phone || '-'}</span></div>
            <div>🆔 Employee ID <span>${currentEmpId || '-'}</span></div>
        `;
        document.getElementById('fullInfo').classList.add('show');
        
        document.getElementById('feeNotice').classList.add('show');
        setTimeout(() => document.getElementById('feeNotice').classList.remove('show'), 4000);
        
        document.getElementById('notifBalance').textContent = '€' + newRem;
        document.getElementById('notification').classList.add('show');
        setTimeout(() => document.getElementById('notification').classList.remove('show'), 5000);
        
        if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
        updateStatus('✅ Access Granted', '#4caf50');
    } catch (err) { updateStatus('❌ Error', '#f44336'); }
    isProcessing = false;
}

async function startReading() {
    hideAll();
    updateStatus('📡 Tap card...', '#ffd700');
    try {
        if (!('NDEFReader' in window)) { updateStatus('❌ NFC not supported', '#f44336'); return; }
        const reader = new NDEFReader();
        await reader.scan();
        reader.onreading = async (e) => {
            if (!e.message?.records) return;
            let isBankCard = false, empId = null;
            for (const r of e.message.records) {
                if (r.recordType !== 'text') continue;
                try {
                    const t = new TextDecoder().decode(r.data);
                    if (t === 'Mastercard_Commerzbank') isBankCard = true;
                    if (t.includes('=')) {
                        const p = t.replace(/[?;]/g, '').split('=');
                        for (const x of p) {
                            const tr = x.trim();
                            if (tr.length >= 10 && tr.length <= 15) { empId = tr; break; }
                        }
                    }
                } catch (ex) {}
            }
            if (!isBankCard) { updateStatus('❌ Not a bank card', '#f44336'); return; }
            if (!empId) { updateStatus('❌ No ID', '#f44336'); return; }
            currentEmpId = empId;
            const snap = await database.ref('employees/' + empId).once('value');
            if (!snap.exists()) { updateStatus('❌ Not found', '#f44336'); return; }
            updateStatus('🔐 Enter PIN', '#ffd700');
            showPinDialog();
        };
    } catch (err) { updateStatus('❌ Error', '#f44336'); }
}

updateStatus('🔒 Ready to Scan', '#ffffff');
</script>

</body>
</html>
